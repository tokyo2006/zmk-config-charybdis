CONFIG_ZMK_SLEEP=y
# 1800000 毫秒 = 30 分钟 * 60 秒 * 1000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
# 进入空闲状态前的不活动毫秒数
CONFIG_ZMK_IDLE_TIMEOUT=15000

# --- DYA Studio Level 2: peripheral only answers relayed Diagnostics
# queries about its own hardware, no Studio RPC of its own ---
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y